<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%">
  <defs>
    <linearGradient id="chronoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="40" height="40" rx="10" fill="url(#chronoGrad)" filter="url(#glow)"/>
  
  <!-- Outer subtle grid border -->
  <rect x="7" y="7" width="26" height="26" rx="6" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="2 2"/>
  
  <!-- Dynamic Sched Grid Paths -->
  <path d="M10 16h20M10 24h20M16 10v20M24 10v20" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Chrono Node Orbit / Matrix -->
  <circle cx="20" cy="20" r="7.5" fill="#0f172a" stroke="#f8fafc" stroke-width="1.8"/>
  
  <!-- Clock / Synchronizer needles -->
  <path d="M20 15.5v4.5l3.2 2" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Active Node Spark -->
  <circle cx="28" cy="12" r="2" fill="#38bdf8"/>
  <circle cx="12" cy="28" r="2" fill="#818cf8"/>
</svg>